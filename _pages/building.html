---
layout: compress
title: Building
---

<div class="archive-wrapper">
  <div class="archive-card">
    <ul class="archive-list">
      {% assign building_posts = site.categories.building | sort: "date" | reverse %}
      {% for post in building_posts %}
      <li class="archive-item">
        <a class="archive-title" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
        <span class="archive-date">
          {{ post.date | date: "%m.%d.%Y" }}
        </span>
      </li>
      {% endfor %}
    </ul>

    <div class="archive-footer">
      <span class="archive-footer-left">BUILDING</span>
      <span class="archive-footer-right">
        <a href="{{ '/' | relative_url }}">Overview ↓</a>
        <span> / </span>
        <a href="/about/">About</a>
      </span>
    </div>
  </div>
</div>
